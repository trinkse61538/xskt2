name: Update XSMN History
on:
  schedule:
    - cron: '20 10,13,18,23 * * *'
  workflow_dispatch:
    inputs:
      recovery_batch:
        description: 'Historical verification requests (0-10 dates; opt-in)'
        default: '0'
        required: false
permissions:
  contents: write
concurrency:
  group: xskt2-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: trinkse61538/xskt
          ref: 2accbacde384b5e514d4f5dcda8f0f07e5cc767b
          path: _legacy_reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Fetch completed days
        id: crawl
        continue-on-error: true
        run: python scripts/update_history.py
      - name: Audit, derive and compare
        id: derive
        env:
          RECOVERY_BATCH: ${{ inputs.recovery_batch || '0' }}
        run: |
          set -e
          [[ "$RECOVERY_BATCH" =~ ^([0-9]|10)$ ]] || exit 2
          python scripts/verify_history_v3.py --limit "$RECOVERY_BATCH"
          python scripts/rebuild_stats.py
          python scripts/score_results.py
          python scripts/backtest.py --legacy-js _legacy_reference/data/v51-2026-2050.v41.js
          python scripts/report_v3.py
      - name: Commit validated data and reports
        if: always() && steps.derive.outcome == 'success'
        run: |
          git config user.name 'xskt2-history-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/history/ data/backtest/
          if ! git diff --cached --quiet; then
            git commit -m 'data: V3 verified history and research'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Report recent integrity failures only
        if: always() && steps.derive.outcome == 'success'
        run: python -c "import json,sys; h=json.load(open('data/history/derived/health.json')); sys.exit(any(x['date'] >= '2026-01-01' for x in h['invalid']))"
      - name: Surface incomplete crawl
        if: always() && steps.crawl.outcome != 'success'
        run: exit 1
