name: Update XSMN History
on:
  schedule:
    - cron: '20 10,13,18,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xskt2-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Fetch completed days and repair gaps
        id: crawl
        continue-on-error: true
        run: python scripts/update_history.py
      - name: Build and verify derived data
        id: derive
        continue-on-error: true
        run: |
          set -e
          python scripts/rebuild_stats.py
          python scripts/score_results.py
      - name: Commit validated progress and diagnostics
        if: always() && steps.derive.outcome == 'success'
        run: |
          git config user.name 'xskt2-history-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/history/
          if ! git diff --cached --quiet; then
            git commit -m 'data: update validated XSMN history'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Surface incomplete updates
        if: always() && (steps.crawl.outcome != 'success' || steps.derive.outcome != 'success')
        run: exit 1
      - name: Verify rejected-record count
        if: always() && steps.derive.outcome == 'success'
        run: python -c "import json,sys; sys.exit(bool(json.load(open('data/history/derived/health.json'))['invalid']))"
