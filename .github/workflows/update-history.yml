name: Update XSMN History
on:
  schedule:
    # GitHub cron is UTC: 09:50 = 16:50 Vietnam; 10:10 = 17:10 Vietnam.
    - cron: "50 9 * * *"
    - cron: "10 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xskt2-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Fetch complete draw only
        run: python scripts/update_history.py
      - name: Rebuild history stats
        if: success()
        run: |
          python scripts/rebuild_stats.py
          python scripts/score_results.py || true
      - name: Commit data changes
        if: success()
        run: |
          git config user.name "xskt2-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update XSMN history"
            git pull --rebase origin main
            git push origin main
          fi
