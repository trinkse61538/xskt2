name: V3.0.1 Stability Checks
on:
  workflow_dispatch:
    inputs:
      probe_date:
        description: 'Optional YYYY-MM-DD completed draw; blank uses latest completed day'
        required: false
        default: ''
  schedule:
    - cron: '40 1 * * *'
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/check_deployment_v301.py
  source_probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - env:
          PROBE_DATE: ${{ inputs.probe_date }}
        run: |
          if [[ -n "$PROBE_DATE" ]]; then
            [[ "$PROBE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
            python scripts/probe_v301.py --date "$PROBE_DATE"
          else
            python scripts/probe_v301.py
          fi
